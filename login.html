<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your TOHA'S MART account." />
    <title>Sign In | TOHA'S MART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="auth-layout">
      <a class="auth-brand" href="/"><span>TOHA'S</span> MART</a>
      <section class="auth-panel" aria-labelledby="auth-title">
        <p class="auth-kicker">YOUR ACCOUNT</p>
        <h1 id="auth-title">Welcome back.</h1>
        <p class="auth-intro">Sign in to manage your account and orders.</p>
        <form id="login-form" class="auth-form">
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" /></label>
          <button class="auth-submit" type="submit">Sign in</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">New to TOHA'S MART? <a href="register.html">Create an account</a></p>
        <a class="auth-back" href="/">Return to the store</a>
      </section>
    </main>
  </body>
</html>
