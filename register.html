<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a TOHA'S MART customer account." />
    <title>Create Account | TOHA'S MART</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="auth-layout">
      <a class="auth-brand" href="/"><span>TOHA'S</span> MART</a>
      <section class="auth-panel" aria-labelledby="auth-title">
        <p class="auth-kicker">JOIN THE STORE</p>
        <h1 id="auth-title">Create your account.</h1>
        <p class="auth-intro">Save your details and keep your orders together.</p>
        <form id="register-form" class="auth-form">
          <label>Full name<input name="fullName" type="text" autocomplete="name" required /></label>
          <label>Email address<input name="email" type="email" autocomplete="email" required /></label>
          <label>Phone number<input name="phone" type="tel" autocomplete="tel" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" /></label>
          <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128" /></label>
          <button class="auth-submit" type="submit">Create account</button>
          <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
        <a class="auth-back" href="/">Return to the store</a>
      </section>
    </main>
  </body>
</html>
